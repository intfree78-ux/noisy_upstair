<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>층간소음 지도 & 커뮤니티</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <header class="bg-indigo-600 text-white p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">🏢 층간소음 지도 & 커뮤니티</h1>
            <span class="text-sm bg-indigo-700 px-3 py-1 rounded-full">테스트 버전</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 mt-6">
        <section class="bg-white p-6 rounded-xl shadow-sm mb-6">
            <h2 class="text-lg font-bold mb-3">📍 우리 동네 건물 층간소음 검색</h2>
            <div class="flex gap-2">
                <input type="text" placeholder="아파트 또는 빌라 이름을 입력하세요 (예: 서울아파트)" class="flex-1 border border-slate-300 p-2 rounded-lg focus:outline-none focus:border-indigo-500">
                <button class="bg-indigo-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-indigo-700">검색</button>
            </div>
        </section>

        <section class="bg-white p-6 rounded-xl shadow-sm">
            <h2 class="text-lg font-bold mb-3">💬 실시간 소통 공간</h2>
            <div class="border-b border-slate-100 py-3">
                <p class="font-medium">위층에서 밤마다 발소리가 너무 심해요 ㅠㅠ</p>
                <span class="text-xs text-slate-400">조회수 12 · 공감 5</span>
            </div>
            <div class="border-b border-slate-100 py-3">
                <p class="font-medium">방음 매트 추천해주실 분 있나요?</p>
                <span class="text-xs text-slate-400">조회수 24 · 공감 8</span>
            </div>
        </section>
    </main>
</body>
</html>
