<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7f4">
<title>후기 관리 · 고요</title>
<style>
:root{--ink:#18251f;--muted:#77827b;--line:#e6eae5;--paper:#fff;--bg:#f5f7f4;--green:#23795b;--red:#b34f43}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;letter-spacing:-.02em}.top{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1000px)/2))}.brand{font-weight:850;font-size:20px;color:inherit;text-decoration:none}.top a:last-child{color:var(--green)}main{max-width:960px;margin:38px auto;padding:0 18px}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.12em}h1{font-size:32px;margin:8px 0}.sub{color:var(--muted);line-height:1.6}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px}.tabs{display:flex;gap:8px}.tabs button{border:1px solid var(--line);background:white;color:#526059;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer}.tabs button.active{background:#eaf4ed;border-color:#c9e2d1;color:var(--green)}.refresh{border:0;background:var(--ink);color:white;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 2px 8px #1e322608}.meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:12px}.meta strong{color:var(--ink)}.content{white-space:pre-wrap;line-height:1.7;margin:15px 0}.actions{display:flex;gap:9px}.actions button{border:0;border-radius:9px;padding:10px 15px;font-weight:800;cursor:pointer}.approve{background:#e6f3e7;color:#27653c}.reject{background:#faece9;color:var(--red)}.empty,.state{padding:28px;text-align:center;color:var(--muted);background:white;border:1px solid var(--line);border-radius:16px}.hidden{display:none!important}.error{color:var(--red)}@media(max-width:600px){main{margin:24px auto}.bar{align-items:flex-start;flex-direction:column}h1{font-size:27px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="./">⌁ 고요</a><a href="./">홈으로</a></header>
<main><p class="eyebrow">ADMIN</p><h1>후기 관리</h1><p class="sub">최초 가입 관리자만 대기 후기를 검토하고 공개 여부를 결정할 수 있습니다. 동·호 정보는 목록에 표시되지 않습니다.</p>
<div id="state" class="state">로그인 상태를 확인하고 있습니다…</div>
<section id="manager" class="hidden"><div class="bar"><div class="tabs"><button class="active" data-status="pending">승인 대기</button><button data-status="approved">공개됨</button><button data-status="rejected">반려됨</button></div><button class="refresh" id="refresh">새로고침</button></div><div id="list" class="empty">목록을 불러오는 중…</div></section>
</main>
<script>const SUPABASE_URL='https://ardhdvnsapvxproknqpr.supabase.co';const SUPABASE_KEY='sb_publishable_Q2rZ5v2j828YuFBKKx5RcQ_kKZtjuZV';let supabase;function loadSupabaseSdk(){return new Promise((resolve,reject)=>{if(window.supabase?.createClient)return resolve();const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';script.onload=()=>window.supabase?.createClient?resolve():reject(new Error('Supabase SDK failed to initialize'));script.onerror=()=>reject(new Error('Supabase SDK could not be loaded'));document.head.appendChild(script);setTimeout(()=>reject(new Error('Supabase SDK load timed out')),10000)})}let statusFilter='pending';const labels={footsteps:'발걸음·충격음',music:'음악·TV',construction:'공사 소음',road:'도로 소음',other:'기타 생활 소음',quiet:'조용한 편'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(text,isError=false){const el=document.getElementById('state');el.textContent=text;el.classList.toggle('error',isError);el.classList.remove('hidden')}
async function loadReviews(){const list=document.getElementById('list');list.className='empty';list.textContent='목록을 불러오는 중…';const {data,error}=await supabase.from('building_reviews').select('id,building_name,housing_type,rating,noise_type,content,status,created_at').eq('status',statusFilter).order('created_at',{ascending:true}).limit(100);if(error){list.textContent='후기 목록을 불러오지 못했습니다: '+error.message;return}if(!data?.length){list.textContent=statusFilter==='pending'?'승인 대기 중인 후기가 없습니다.':'해당 상태의 후기가 없습니다.';return}list.className='';list.innerHTML=data.map(r=>'<article class="card"><div class="meta"><strong>'+esc(r.building_name)+'</strong><span>'+esc(r.housing_type||'주거 유형 미상')+'</span><span>★ '+r.rating+'/5</span><span>'+esc(labels[r.noise_type]||'생활 소음')+'</span><span>'+new Date(r.created_at).toLocaleString('ko-KR')+'</span></div><p class="content">'+esc(r.content)+'</p>'+(statusFilter==='pending'?'<div class="actions"><button class="approve" data-id="'+esc(r.id)+'" data-next="approved">승인 후 공개</button><button class="reject" data-id="'+esc(r.id)+'" data-next="rejected">반려</button></div>':'')+'</article>').join('');list.querySelectorAll('[data-next]').forEach(btn=>btn.addEventListener('click',()=>changeStatus(btn.dataset.id,btn.dataset.next,btn)))}
async function changeStatus(id,next,button){button.disabled=true;const {error}=await supabase.from('building_reviews').update({status:next}).eq('id',id);if(error){button.disabled=false;alert('상태를 변경하지 못했습니다: '+error.message);return}await loadReviews()}async function init(){try{await loadSupabaseSdk();supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(error){message('로그인 서비스를 불러오지 못했습니다. 페이지를 새로고침해 주세요.',true);return}let session=null;try{const result=await Promise.race([supabase.auth.getSession(),new Promise(resolve=>setTimeout(()=>resolve({data:{session:null}}),5000))]);session=result?.data?.session||null}catch(error){message('로그인 상태를 확인하지 못했습니다. 새로고침해 주세요.',true);return}if(!session){message('관리자 계정으로 로그인해 주세요.');const s=document.getElementById('state');s.innerHTML='관리자 계정으로 <a href="./login.html?next=admin">로그인</a>해 주세요.';return}const {data:isAdmin,error}=await supabase.rpc('is_site_admin');if(error){message('관리자 권한을 확인할 수 없습니다. Supabase 관리자 설정을 확인해 주세요.',true);return}if(!isAdmin){message('이 계정에는 후기 관리 권한이 없습니다.',true);return}document.getElementById('state').classList.add('hidden');document.getElementById('manager').classList.remove('hidden');await loadReviews()}
document.querySelectorAll('[data-status]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-status]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');statusFilter=btn.dataset.status;loadReviews()}));let adminToken=null;async function loadReviews(){const list=document.getElementById('list');list.className='empty';list.textContent='후기 목록을 불러오는 중…';try{const url=SUPABASE_URL+'/rest/v1/building_reviews?select=id,building_name,housing_type,rating,noise_type,content,status,created_at&status=eq.'+encodeURIComponent(statusFilter)+'&order=created_at.asc&limit=100';const response=await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+adminToken}});const data=await response.json();if(!response.ok)throw new Error(data.message||data.hint||'HTTP '+response.status);if(!Array.isArray(data)||!data.length){list.textContent=statusFilter==='pending'?'승인 대기 중인 후기가 없습니다.':'해당 상태의 후기가 없습니다.';return}list.className='';list.innerHTML=data.map(r=>'<article class="card"><div class="meta"><strong>'+esc(r.building_name)+'</strong><span>'+esc(r.housing_type||'주거 유형 미상')+'</span><span>★ '+r.rating+'/5</span><span>'+esc(labels[r.noise_type]||'생활 소음')+'</span><span>'+new Date(r.created_at).toLocaleString('ko-KR')+'</span></div><p class="content">'+esc(r.content)+'</p>'+(statusFilter==='pending'?'<div class="actions"><button class="approve" data-id="'+esc(r.id)+'" data-next="approved">승인 후 공개</button><button class="reject" data-id="'+esc(r.id)+'" data-next="rejected">반려</button></div>':'')+'</article>').join('');list.querySelectorAll('[data-next]').forEach(btn=>btn.addEventListener('click',()=>changeStatus(btn.dataset.id,btn.dataset.next,btn)))}catch(error){list.textContent='후기 조회 실패: '+error.message}}async function changeStatus(id,next,button){button.disabled=true;try{const response=await fetch(SUPABASE_URL+'/rest/v1/building_reviews?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+adminToken,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({status:next})});if(!response.ok){const error=await response.json();throw new Error(error.message||'HTTP '+response.status)}await loadReviews()}catch(error){button.disabled=false;alert('상태 변경 실패: '+error.message)}}async function init(){try{let session=null;for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.startsWith('sb-')&&key.endsWith('-auth-token')){const parsed=JSON.parse(localStorage.getItem(key)||'null');session=parsed?.currentSession||parsed;if(session?.access_token)break}}if(!session?.access_token){message('관리자 계정으로 로그인해 주세요.');document.getElementById('state').innerHTML='관리자 계정으로 <a href="./login.html?next=admin">로그인</a>해 주세요.';return}adminToken=session.access_token;const check=await fetch(SUPABASE_URL+'/rest/v1/rpc/is_site_admin',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+adminToken,'Content-Type':'application/json'},body:'{}'});const result=await check.json();if(!check.ok)throw new Error(result.message||'관리자 권한 확인 실패');if(result!==true){message('이 계정에는 후기 관리 권한이 없습니다.',true);return}document.getElementById('state').classList.add('hidden');document.getElementById('manager').classList.remove('hidden');await loadReviews()}catch(error){message('관리자 확인 실패: '+error.message,true)}}
document.querySelectorAll('[data-status]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-status]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');statusFilter=btn.dataset.status;loadReviews()}));document.getElementById('refresh').addEventListener('click',loadReviews);init();
</script>
</body>
</html>
